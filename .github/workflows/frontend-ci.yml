name: HelmsKB frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'website-docs/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'website-docs/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            website-docs/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: website-docs
      - run: npm run check:docs
        working-directory: website-docs
      - run: npm run check-i18n
      - run: npm run check:docs-links
      - name: Assistant and interaction regression checks
        run: npm test -- src/components/assistant/AssistantPanel.test.ts src/views/settings/AssistantSettings.test.ts src/composables/useChatStreamHandler.suspend.test.ts src/composables/usePromptDock.test.mjs src/utils/askUser.test.ts src/config/settingsAccess.test.ts
      - run: npm run build:with-docs
