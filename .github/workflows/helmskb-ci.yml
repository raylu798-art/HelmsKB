name: HelmsKB validation
on:
  push:
    branches: [main, 'migration/**', 'sync/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: helmskb/build/package-lock.json
      - run: npm ci --prefix helmskb/build --no-audit --no-fund
      - run: npm test --prefix helmskb/build
      - run: node helmskb/build/prepare.mjs
      - run: node helmskb/build/build-web.mjs
      - run: git diff --exit-code
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: 24}
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: npm ci --prefix helmskb/build --no-audit --no-fund && node helmskb/build/prepare.mjs
      - run: node helmskb/build/run-staged.mjs go test ./internal/productdocs ./internal/agent/... ./internal/handler/... ./internal/application/service/...
  docreader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@v6
        with: {python-version: '3.10'}
      - run: python -m compileall -q docreader/docreader
